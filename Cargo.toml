[package]
name = "tuya-stress"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Стресс-тест Tuya-устройств по локальному протоколу 3.3/3.4/3.5"
license = "MIT"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
hmac = "0.12"
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
